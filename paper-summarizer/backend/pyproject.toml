[project]
name = "paper-summarizer-backend"
version = "0.1.0"
description = "PaperSummarizer for Students - backend (FastAPI + Gemini)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "google-genai==2.34.0",
    "python-multipart==0.0.33",
    "python-dotenv==1.2.4",
    "pypdfium2==5.15.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: 行長は formatter に任せる（日本語の長い文字列は折り返さない）
# UP042: Gemini の response_schema に渡す Enum の型を変えないため
ignore = ["E501", "UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI の依存宣言（File(...) / Form(...)）は既定値での関数呼び出しが正しい書き方
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
