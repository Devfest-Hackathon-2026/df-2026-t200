<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d5bc9"/></marker></defs><rect width="1600" height="860" fill="#fbfbf8"/><text x="40" y="58" font-size="32" font-weight="700" fill="#24282c" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">PaperSummarizer for Students の本番構成</text><text x="40" y="92" font-size="18" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">Google Cloud プロジェクト devfeshack（2026年11月8日時点）。アイコンは Google Cloud 公式アイコン</text><rect x="330" y="130" width="1240" height="480" rx="18" fill="none" stroke="#8c9298" stroke-width="2" stroke-dasharray="10 8"/><text x="350" y="160" font-size="18" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">Google Cloud（Cloud Run と Cloud Storage は東京リージョン asia-northeast1）</text><rect x="40" y="300" width="250" height="150" rx="14" fill="#ffffff" stroke="#c9cccf" stroke-width="2"/><text x="60" y="344" font-size="24" font-weight="700" fill="#24282c" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">学生のブラウザ</text><text x="60" y="376" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">PDF を選び、解説と</text><text x="60" y="402" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">PDF を並べて読む</text><text x="60" y="428" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">ログインなし</text><rect x="370" y="300" width="330" height="150" rx="14" fill="#ffffff" stroke="#c9cccf" stroke-width="2"/><image href="data:image/svg+xml;base64," x="388" y="318" width="64" height="64"/><text x="468" y="344" font-size="24" font-weight="700" fill="#24282c" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">Firebase Hosting</text><text x="468" y="376" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">画面（React・pdf.js・KaTeX）</text><text x="468" y="402" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">/api/** を Cloud Run へ転送</text><rect x="790" y="300" width="370" height="170" rx="14" fill="#ffffff" stroke="#c9cccf" stroke-width="2"/><image href="data:image/svg+xml;base64," x="808" y="318" width="64" height="64"/><text x="888" y="344" font-size="24" font-weight="700" fill="#24282c" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">Cloud Run</text><text x="888" y="376" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">paper-summarizer-api（FastAPI）</text><text x="888" y="402" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">解析・Q&amp;A・引用の照合</text><text x="888" y="428" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">最大1台・1日の利用上限</text><rect x="1220" y="150" width="340" height="175" rx="14" fill="#ffffff" stroke="#c9cccf" stroke-width="2"/><image href="data:image/svg+xml;base64," x="1238" y="168" width="64" height="64"/><text x="1318" y="194" font-size="24" font-weight="700" fill="#24282c" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">Vertex AI</text><text x="1318" y="226" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">Gemini（gemini-3.6-flash）</text><text x="1318" y="252" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">global エンドポイントで呼ぶ</text><text x="1318" y="278" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">PDF をそのまま読み、</text><text x="1318" y="304" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">引用付きの JSON を返す</text><rect x="1220" y="440" width="340" height="150" rx="14" fill="#ffffff" stroke="#c9cccf" stroke-width="2"/><image href="data:image/svg+xml;base64," x="1238" y="458" width="64" height="64"/><text x="1318" y="484" font-size="24" font-weight="700" fill="#24282c" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">Cloud Storage</text><text x="1318" y="516" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">非公開のバケット</text><text x="1318" y="542" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">PDF・解析結果・会話（JSON）</text><text x="1318" y="568" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">Cloud Run の /data にマウント</text><rect x="370" y="680" width="420" height="140" rx="14" fill="#ffffff" stroke="#c9cccf" stroke-width="2"/><image href="data:image/svg+xml;base64," x="388" y="698" width="64" height="64"/><text x="468" y="724" font-size="24" font-weight="700" fill="#24282c" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">GitHub Actions</text><text x="468" y="756" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">CI（テスト）→ Deploy</text><text x="468" y="782" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">Workload Identity 連携で認証</text><text x="468" y="808" font-size="17" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">（鍵ファイルを使わない）</text><line x1="290" y1="375" x2="368" y2="375" stroke="#1d5bc9" stroke-width="3" marker-end="url(#a)"/><text x="329" y="362" font-size="17" fill="#123f8f" text-anchor="middle" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">HTTPS</text><line x1="700" y1="375" x2="788" y2="375" stroke="#1d5bc9" stroke-width="3" marker-end="url(#a)"/><text x="744" y="362" font-size="17" fill="#123f8f" text-anchor="middle" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">/api/**</text><line x1="1160" y1="340" x2="1218" y2="260" stroke="#1d5bc9" stroke-width="3" marker-end="url(#a)"/><text x="1110" y="215" font-size="17" fill="#123f8f" text-anchor="middle" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">PDF＋指示</text><text x="1110" y="237" font-size="17" fill="#123f8f" text-anchor="middle" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">→ 引用付き JSON</text><line x1="1160" y1="430" x2="1218" y2="500" stroke="#1d5bc9" stroke-width="3" marker-end="url(#a)"/><text x="1150" y="505" font-size="17" fill="#123f8f" text-anchor="middle" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">読み書き</text><line x1="560" y1="678" x2="560" y2="452" stroke="#1d5bc9" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="470" y="560" font-size="17" fill="#123f8f" text-anchor="middle" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">main へのマージで</text><text x="470" y="582" font-size="17" fill="#123f8f" text-anchor="middle" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">自動デプロイ</text><line x1="700" y1="680" x2="900" y2="472" stroke="#1d5bc9" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="0" y="0" font-size="17" fill="#123f8f" text-anchor="middle" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif"></text><text x="40" y="845" font-size="15" fill="#4a5056" font-family="BIZ UDPGothic, Noto Sans JP, IPAPGothic, sans-serif">Q&amp;A も同じ Cloud Run から Gemini を呼ぶ。同じ PDF は Gemini を呼ばずに解析結果を使い回す。サービスアカウントは Vertex AI の利用とこのバケットの読み書きだけを持つ。</text></svg>