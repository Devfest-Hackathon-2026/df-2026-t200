name: Deploy

# main への push で CI が成功したら、Cloud Run と Firebase Hosting にデプロイする（CD）。
# GCP へは鍵ファイルを使わず、Workload Identity 連携で入る。設定は paper-summarizer/deploy.sh の cd-setup で作る。
# GCP 側の条件で、このリポジトリの main ブランチの、このワークフローからしかデプロイ用アカウントになれない。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# デプロイを重ねて走らせない（後のものは前のものが終わるまで待つ）
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: devfeshack
  WIF_PROVIDER: projects/126669840987/locations/global/workloadIdentityPools/github/providers/github
  DEPLOY_SA: github-deployer@devfeshack.iam.gserviceaccount.com
  NODE_VERSION: "22"

jobs:
  deploy:
    name: deploy (Cloud Run + Firebase Hosting)
    # main の push で CI が通ったとき（このリポジトリのコミットだけ）か、main からの手動実行
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: paper-summarizer
    steps:
      - uses: actions/checkout@v7
        with:
          # CI が通ったコミットそのものをデプロイする
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # 本番で動いているコミットと比べて、文書だけの変更かを調べる
          fetch-depth: 0
      - name: Skip if this is not the latest main
        # 古いコミットの CI を再実行したときに、古い版を本番に出さない
        id: latest
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$(git rev-parse HEAD)" ]; then
            echo "::notice::main は $head に進んでいるので、このコミットはデプロイしない"
            exit 0
          fi
          # 本番で動いているコミット（/api/health の version）からの変更が文書（*.md と docs/）だけなら、
          # イメージを作り直さない。version が読めない・履歴に無いときと、手動実行のときは常にデプロイする
          deployed=$(curl -fsS "https://${PROJECT_ID}.web.app/api/health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || true)
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ -n "$deployed" ] && git merge-base --is-ancestor "$deployed" HEAD 2>/dev/null; then
            code=$(git diff --name-only "$deployed" HEAD | grep -vE '(\.md$|^docs/)' || true)
            if [ -z "$code" ]; then
              echo "::notice::本番（$deployed）からの変更が文書だけなので、デプロイしない"
              exit 0
            fi
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # 依存パッケージのスクリプトにデプロイ用の認証情報を見せないよう、認証より前にビルドする
      - uses: actions/setup-node@v7
        if: steps.latest.outputs.ok == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: paper-summarizer/frontend/package-lock.json
      - name: Build web
        if: steps.latest.outputs.ok == 'true'
        working-directory: paper-summarizer/frontend
        run: npm ci && npm run build

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.latest.outputs.ok == 'true'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.latest.outputs.ok == 'true'
      - name: Deploy API (Cloud Run)
        if: steps.latest.outputs.ok == 'true'
        # 「誰でも呼べる」設定は変えない（デプロイ用アカウントにその権限を渡していない）
        run: SKIP_INVOKER_IAM=1 GIT_SHA="$(git rev-parse HEAD)" ./deploy.sh api
      - name: Deploy web (Firebase Hosting)
        if: steps.latest.outputs.ok == 'true'
        run: SKIP_WEB_BUILD=1 ./deploy.sh web
      - name: Smoke test
        if: steps.latest.outputs.ok == 'true'
        run: |
          health=$(curl -fsS "https://${PROJECT_ID}.web.app/api/health")
          echo "$health"
          echo "$health" | grep -q '"backend":"vertex"'
          echo "$health" | grep -q "\"version\":\"$(git rev-parse HEAD)\""
          curl -fsSI "https://${PROJECT_ID}.web.app/" | grep -qi '^cache-control: no-cache'
